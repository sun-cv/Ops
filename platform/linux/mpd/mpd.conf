


music_directory         "~/music"
db_file                 "~/.config/mpd/database"
playlist_directory      "~/.config/mpd/playlists"
sticker_file            "~/.config/mpd/sticker_file"

audio_output {
    type "pulse"
    name "PulseAudio"
}
decoder {
    plugin "wildmidi"
    enabled "no"
}
bind_to_address "/tmp/mpd.socket"
